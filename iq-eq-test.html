<title>Trắc nghiệm IQ – EQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Bố cục: một cột hẹp, mỗi màn hình một việc (chọn bài → hướng dẫn → làm từng câu → kết quả).
   Màu: nền giấy lạnh, mực xanh đậm; chàm cho IQ, đất nung cho EQ, xám đá cho bài luyện tập. */
:root {
  --bg: #f2f4f7;
  --surface: #ffffff;
  --sunk: #e8ecf1;
  --fg: #111a2b;
  --muted: #5b6678;
  --line: #d6dce5;
  --iq: #3346c4;
  --iq-soft: #e6e9fa;
  --eq: #c4552f;
  --eq-soft: #f8e7df;
  --pr: #4b6a6a;
  --pr-soft: #e1ebea;
  --ok: #23804f;
  --ok-soft: #dff1e7;
  --warn: #b42318;
  --warn-soft: #fbe4e1;
  --shadow: 0 1px 2px rgba(17, 26, 43, .06), 0 8px 24px rgba(17, 26, 43, .06);
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --accent: var(--iq);
  --accent-soft: var(--iq-soft);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d131c; --surface: #151d29; --sunk: #1b2533; --fg: #e7ecf3; --muted: #9aa6b8; --line: #2a3546;
    --iq: #98a6ff; --iq-soft: #1f2650; --eq: #f08e66; --eq-soft: #3d231a; --pr: #8fbcbb; --pr-soft: #1c2f2f;
    --ok: #6fd39c; --ok-soft: #173326; --warn: #ff9a8f; --warn-soft: #3d1c19;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d131c; --surface: #151d29; --sunk: #1b2533; --fg: #e7ecf3; --muted: #9aa6b8; --line: #2a3546;
  --iq: #98a6ff; --iq-soft: #1f2650; --eq: #f08e66; --eq-soft: #3d231a; --pr: #8fbcbb; --pr-soft: #1c2f2f;
  --ok: #6fd39c; --ok-soft: #173326; --warn: #ff9a8f; --warn-soft: #3d1c19;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55; padding-inline: 16px; padding-block: 0 56px; -webkit-font-smoothing: antialiased; }
.t-iq { --accent: var(--iq); --accent-soft: var(--iq-soft); }
.t-eq { --accent: var(--eq); --accent-soft: var(--eq-soft); }
.t-pr { --accent: var(--pr); --accent-soft: var(--pr-soft); }
#app { max-width: 760px; margin: 0 auto; }
.stack { display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; font-weight: 600; }
h1 { font-size: clamp(1.9rem, 5vw, 2.6rem); letter-spacing: -.01em; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.08rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.eyebrow { font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* Đầu trang */
.hero { padding-block: 40px 8px; display: flex; flex-direction: column; gap: 12px; }
.hero p { max-width: 58ch; color: var(--muted); font-size: 1.05rem; }

/* Thẻ chọn bài */
.tests { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.test { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; box-shadow: var(--shadow); }
.test .tag { align-self: flex-start; font-size: .74rem; font-weight: 600; letter-spacing: .04em; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.test h2 { font-size: 1.25rem; }
.test p { color: var(--muted); font-size: .93rem; flex: 1; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .84rem; color: var(--muted); }
.meta b { color: var(--fg); font-weight: 600; }
.test.featured { border: 1.5px solid var(--accent); }

/* Nút */
button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 11px 18px; min-height: 44px; transition: background .15s, border-color .15s, transform .05s; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:active:not(:disabled) { transform: translateY(1px); }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 10px; }
.btn-ghost:hover:not(:disabled) { color: var(--fg); border-color: var(--line); }
button:disabled { opacity: .4; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.spread { justify-content: space-between; }

/* Khối thông tin */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.panel ul, .panel ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.notice { border-radius: 12px; padding: 14px 16px; font-size: .92rem; display: flex; flex-direction: column; gap: 6px; }
.notice.warn { background: var(--warn-soft); color: var(--fg); border: 1px solid var(--warn); }
.notice.info { background: var(--accent-soft); border: 1px solid var(--accent); }
.missing { color: var(--warn); font-weight: 600; }
details.panel summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
details.panel summary::after { content: "+"; font-family: var(--font-mono); color: var(--muted); }
details.panel[open] summary::after { content: "–"; }

/* Màn hình hướng dẫn */
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.fact { background: var(--sunk); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.fact b { font-family: var(--font-mono); font-size: 1.15rem; }
.fact span { font-size: .8rem; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; }
select { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); min-height: 44px; max-width: 100%; }
label.check { display: flex; gap: 12px; align-items: flex-start; font-size: .92rem; cursor: pointer; }
label.check input { margin-top: 3px; width: 20px; height: 20px; flex: none; accent-color: var(--accent); }

/* Màn hình làm bài */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; background: var(--bg); padding-block: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.bar-title { font-weight: 600; font-size: .95rem; }
.timer { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: .95rem; padding: 4px 10px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); }
.timer.low { background: var(--warn-soft); color: var(--warn); }
.segs { display: grid; gap: 3px; }
.segs i { height: 6px; border-radius: 3px; background: var(--line); }
.segs i.done { background: var(--accent); opacity: .55; }
.segs i.cur { background: var(--accent); }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: clamp(18px, 4vw, 28px); display: flex; flex-direction: column; gap: 18px; box-shadow: var(--shadow); }
.qhead { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.qnum { font-family: var(--font-mono); font-size: .82rem; color: var(--muted); }
.qtype { font-size: .78rem; font-weight: 600; color: var(--accent); }
.qtext { font-size: 1.15rem; font-weight: 500; line-height: 1.5; }
.stimulus { background: var(--sunk); border-radius: 12px; padding: 16px; display: grid; place-items: center; min-height: 120px; }
.stimulus img { max-width: 100%; height: auto; border-radius: 6px; }
.placeholder { border: 1.5px dashed var(--line); border-radius: 12px; padding: 18px; text-align: center; color: var(--muted); font-size: .9rem; display: flex; flex-direction: column; gap: 4px; }
.series { font-family: var(--font-mono); font-size: 1.35rem; letter-spacing: .03em; overflow-wrap: anywhere; text-align: center; }
.matrix { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 300px; width: 100%; }
.cell { aspect-ratio: 1; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; display: grid; place-items: center; color: var(--fg); background: var(--surface); }
.cell svg { width: 86%; height: 86%; }
.cell.q { font-family: var(--font-display); font-size: 2rem; color: var(--accent); border: 2px dashed var(--accent); background: var(--accent-soft); }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.opts.fig { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opts.eight { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.opt { text-align: left; display: flex; gap: 12px; align-items: center; min-width: 0; padding: 12px 14px; border-width: 1.5px; }
.opt .k { font-family: var(--font-mono); font-size: .82rem; font-weight: 600; flex: none; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 7px; background: var(--sunk); color: var(--muted); }
.opt.fig { flex-direction: column; padding: 8px; gap: 6px; }
.opt.fig svg { width: 100%; max-width: 88px; aspect-ratio: 1; color: var(--fg); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-pressed="true"] .k { background: var(--accent); color: var(--surface); }
.likert { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.likert .opt { flex-direction: column; text-align: center; font-size: .78rem; padding: 12px 4px; gap: 6px; line-height: 1.3; }
.likert .opt .k { width: 34px; height: 34px; font-size: 1rem; border-radius: 50%; }
.likert-ends { display: none; justify-content: space-between; font-size: .78rem; color: var(--muted); }
.nav { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.kbd { font-size: .78rem; color: var(--muted); text-align: center; }
.kbd kbd { font-family: var(--font-mono); font-size: .74rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); }
.grid-nav { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; }
.grid-nav button { min-height: 38px; padding: 0; font-family: var(--font-mono); font-size: .8rem; border-radius: 8px; }
.grid-nav button.done { background: var(--accent-soft); border-color: var(--accent); }
.grid-nav button.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.sheet { border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

/* Kết quả */
.score-hero { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; }
.big { font-family: var(--font-display); font-size: clamp(3.4rem, 12vw, 5rem); font-weight: 700; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.band { display: inline-block; font-weight: 600; padding: 3px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: .9rem; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--sunk); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.kpi b { font-family: var(--font-mono); font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.kpi span { font-size: .8rem; color: var(--muted); }
.curve { width: 100%; height: auto; display: block; }
.curve text { font-family: var(--font-mono); font-size: 18px; fill: var(--muted); }
.curve .lbl { fill: var(--accent); font-weight: 700; font-size: 22px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .92rem; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
td.n { font-family: var(--font-mono); white-space: nowrap; }
tr.me td { background: var(--accent-soft); font-weight: 600; }
.tablewrap { overflow-x: auto; }
.meter { height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; min-width: 70px; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; }
.dot { font-family: var(--font-mono); font-size: .74rem; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; }
.dot.ok { background: var(--ok-soft); color: var(--ok); }
.dot.no { background: var(--warn-soft); color: var(--warn); }
.save { font-size: .86rem; color: var(--muted); }

@media (max-width: 520px) {
  .score-hero { grid-template-columns: 1fr; gap: 12px; }
  .opts.eight { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .likert .opt span:last-child { display: none; }
  .likert-ends { display: flex; }
  .kbd { display: none; }
}
@media (prefers-reduced-motion: reduce) { button { transition: none; } }

<script>
(() => {
// ================= Tiện ích =================
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, seed) { const r = rng(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const LETTERS = "ABCDEFGH";
const fmt = s => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;

// ================= ICAR16 =================
// Mã câu và đáp án (số thứ tự phương án đúng, tính từ 1) theo bộ dữ liệu iqitems, gói psychTools 2.6.4
// (Condon & Revelle, 2014). Nội dung câu hỏi (prompt/image/options) được nạp sau khi đăng ký tại icar-project.org.
const ICAR_TYPES = { VR: "Suy luận ngôn ngữ", LN: "Dãy chữ – số", MR: "Suy luận ma trận", R3D: "Xoay khối 3D" };
const ICAR16 = [
  { id: "VR.04", type: "VR", key: 4, n: 6 }, { id: "LN.07", type: "LN", key: 6, n: 6 }, { id: "MR.45", type: "MR", key: 5, n: 6 }, { id: "R3D.03", type: "R3D", key: 3, n: 8 },
  { id: "VR.16", type: "VR", key: 4, n: 6 }, { id: "LN.33", type: "LN", key: 3, n: 6 }, { id: "MR.46", type: "MR", key: 2, n: 6 }, { id: "R3D.04", type: "R3D", key: 2, n: 8 },
  { id: "VR.17", type: "VR", key: 4, n: 6 }, { id: "LN.34", type: "LN", key: 4, n: 6 }, { id: "MR.47", type: "MR", key: 2, n: 6 }, { id: "R3D.06", type: "R3D", key: 6, n: 8 },
  { id: "VR.19", type: "VR", key: 6, n: 6 }, { id: "LN.58", type: "LN", key: 4, n: 6 }, { id: "MR.55", type: "MR", key: 4, n: 6 }, { id: "R3D.08", type: "R3D", key: 7, n: 8 }
].map(it => ({ ...it, prompt: null, image: null, options: null }));
const ICAR_LOADED = ICAR16.every(it => (it.prompt || it.image) && Array.isArray(it.options) && it.options.length === it.n);

// Bảng quy đổi: 1.248 người làm đủ 16 câu trong bộ dữ liệu ability (psychTools 2.6.4, dự án SAPA, 08–31/8/2012).
// Thứ hạng % = (số người điểm thấp hơn + một nửa số người cùng điểm) / 1.248; IQ = 100 + 15 × z(thứ hạng).
// Độ tin cậy α = 0,828 → sai số chuẩn 6,2 điểm IQ → khoảng tin cậy 90% = ±10.
const NORM = [
  { raw: 0, pct: 0.4, iq: 60 }, { raw: 1, pct: 2.0, iq: 69 }, { raw: 2, pct: 5.6, iq: 76 }, { raw: 3, pct: 10.7, iq: 81 },
  { raw: 4, pct: 16.2, iq: 85 }, { raw: 5, pct: 22.2, iq: 89 }, { raw: 6, pct: 29.2, iq: 92 }, { raw: 7, pct: 37.7, iq: 95 },
  { raw: 8, pct: 47.0, iq: 99 }, { raw: 9, pct: 55.6, iq: 102 }, { raw: 10, pct: 63.5, iq: 105 }, { raw: 11, pct: 71.7, iq: 109 },
  { raw: 12, pct: 79.6, iq: 112 }, { raw: 13, pct: 86.2, iq: 116 }, { raw: 14, pct: 91.3, iq: 120 }, { raw: 15, pct: 95.6, iq: 126 },
  { raw: 16, pct: 98.8, iq: 134 }
];
const CI90 = 10;
// Nhãn mô tả theo thang phân loại của Wechsler.
function iqBand(iq) {
  if (iq >= 130) return "Rất cao"; if (iq >= 120) return "Cao"; if (iq >= 110) return "Trên trung bình";
  if (iq >= 90) return "Trung bình"; if (iq >= 80) return "Dưới trung bình"; if (iq >= 70) return "Thấp"; return "Rất thấp";
}

// ================= Bài luyện tập (câu tự soạn, chưa chuẩn hóa) =================
const SIZE = [0.55, 0.78, 1];
function shapeSvg(shape, x, y, s, fill, rot) {
  const r = 13 * s;
  const f = fill === 2 ? 'fill="currentColor"' : fill === 1 ? 'fill="currentColor" fill-opacity="0.35"' : 'fill="none"';
  const common = `${f} stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"`;
  const tr = `transform="translate(${x} ${y}) rotate(${rot})"`;
  switch (shape) {
    case "circle": return `<circle cx="${x}" cy="${y}" r="${r}" ${common}/>`;
    case "square": return `<g ${tr}><rect x="${-r}" y="${-r}" width="${2 * r}" height="${2 * r}" ${common}/></g>`;
    case "triangle": return `<g ${tr}><polygon points="0,${-r * 1.1} ${r * 1.05},${r * 0.75} ${-r * 1.05},${r * 0.75}" ${common}/></g>`;
    case "diamond": return `<g ${tr}><polygon points="0,${-r * 1.2} ${r * 0.9},0 0,${r * 1.2} ${-r * 0.9},0" ${common}/></g>`;
    case "hexagon": { const p = []; for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i; p.push(`${(r * 1.05 * Math.cos(a)).toFixed(2)},${(r * 1.05 * Math.sin(a)).toFixed(2)}`); } return `<g ${tr}><polygon points="${p.join(" ")}" ${common}/></g>`; }
    case "arrow": return `<g ${tr}><polygon points="0,${-r * 1.4} ${r},${-r * 0.2} ${r * 0.38},${-r * 0.2} ${r * 0.38},${r * 1.3} ${-r * 0.38},${r * 1.3} ${-r * 0.38},${-r * 0.2} ${-r},${-r * 0.2}" ${common}/></g>`;
  }
  return "";
}
const POS = { 1: [[50, 50]], 2: [[30, 50], [70, 50]], 3: [[50, 27], [27, 70], [73, 70]], 4: [[30, 30], [70, 30], [30, 70], [70, 70]], 5: [[27, 27], [73, 27], [50, 50], [27, 73], [73, 73]] };
function cellSvg(c) {
  const count = c.count || 1, s = SIZE[c.size ?? 1] * (count > 2 ? 0.72 : count === 2 ? 0.85 : 1.25);
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${POS[count].map(([x, y]) => shapeSvg(c.shape, x, y, s, c.fill ?? 2, c.rot || 0)).join("")}</svg>`;
}
const keyOf = c => [c.shape, c.count || 1, c.fill ?? 2, c.size ?? 1, c.rot || 0].join("|");
const ROTS = [0, 45, 90, 135, 180, 225, 270, 315];

  { gen: (r, c) => ({ shape: ["circle", "square", "triangle"][r], count: c + 1 }), vary: { shape: ["circle", "square", "triangle"], count: [1, 2, 3, 4] } },

function buildMatrixItem(spec, idx) {
  const cells = []; for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) cells.push(spec.gen(r, c));
  const answer = cells[8], ak = keyOf(answer), seen = new Set([ak]), singles = [], pairs = [], attrs = Object.keys(spec.vary);
  for (const a of attrs) for (const v of spec.vary[a]) { const d = { ...answer, [a]: v }, k = keyOf(d); if (!seen.has(k)) { seen.add(k); singles.push(d); } }
  for (let i = 0; i < attrs.length; i++) for (let j = i + 1; j < attrs.length; j++) for (const v of spec.vary[attrs[i]]) for (const w of spec.vary[attrs[j]]) { const d = { ...answer, [attrs[i]]: v, [attrs[j]]: w }, k = keyOf(d); if (!seen.has(k)) { seen.add(k); pairs.push(d); } }
  const options = shuffle([answer, ...shuffle(singles, idx * 97 + 11).concat(shuffle(pairs, idx * 31 + 7)).slice(0, 5)], idx * 13 + 5);

let IS_OWNER = false, timerId = null;

function startTest(kind) {
  const n = TESTS[kind].items().length;
  S = { ...S, view: "test", test: kind, idx: 0, answers: new Array(n).fill(null), start: Date.now(), remaining: PR_SECONDS, sheet: null, result: null, saveMsg: "", demo: kind === "icar" && !ICAR_LOADED };
  if (TESTS[kind].timed) runTimer();
  render(true);
}
function runTimer() {
  clearInterval(timerId);
  const end = Date.now() + S.remaining * 1000;
  timerId = setInterval(() => {
    S.remaining = Math.max(0, Math.round((end - Date.now()) / 1000));
    const t = $("#timer"); if (t) { t.textContent = fmt(S.remaining); t.classList.toggle("low", S.remaining <= 120); }
    if (S.remaining <= 0) finish();
  }, 500);
}

function finish() {
  clearInterval(timerId);
  const seconds = Math.round((Date.now() - S.start) / 1000);
  const items = TESTS[S.test].items();
  if (S.test === "icar") {
    const byType = {};
    const correct = items.map((q, i) => { const ok = S.answers[i] === q.key ? 1 : 0; byType[q.type] = byType[q.type] || { right: 0, total: 0 }; byType[q.type].right += ok; byType[q.type].total++; return ok; });
    const raw = correct.reduce((a, b) => a + b, 0), row = NORM[raw];
    S.result = { kind: "icar", raw, iq: row.iq, pct: row.pct, lo: row.iq - CI90, hi: row.iq + CI90, byType, items: correct, ids: items.map(q => q.id), seconds, answered: S.answers.filter(a => a !== null).length, demo: S.demo };
  } else if (S.test === "practice") {
    const sec = {};
    const correct = items.map((q, i) => { const ok = S.answers[i] === q.answer ? 1 : 0; sec[q.section] = sec[q.section] || { right: 0, total: 0 }; sec[q.section].right += ok; sec[q.section].total++; return ok; });
    S.result = { kind: "practice", raw: correct.reduce((a, b) => a + b, 0), total: items.length, answered: S.answers.filter(a => a !== null).length, sections: sec, seconds: Math.min(seconds, PR_SECONDS), items: correct };
  } else {
    const dom = EQ_DOMAINS.map(() => 0);
    items.forEach((q, i) => { const v = S.answers[i]; dom[q.domain] += q.reverse ? 6 - v : v; });
    S.result = { kind: "eq", domains: dom, total: dom.reduce((a, b) => a + b, 0), seconds, items: S.answers.slice() };
  }
  S.view = "result"; S.sheet = null;
  render(true);
  if (S.consent && !S.result.demo) saveResult();
}

async function saveResult() {
  S.saveMsg = "Đang gửi kết quả ẩn danh…"; renderSave();
  try {
    const db = await window.claude?.use?.("db");
    const user = await window.claude?.use?.("user");
    const id = user ? await user.id() : null;
    if (!db || !id) { S.saveMsg = "Chưa gửi được: tài khoản của bạn chưa có quyền ghi dữ liệu trên trang này. Kết quả vẫn hiển thị bình thường."; renderSave(); return; }
    const ref = db.doc("results/" + id);
    let cur = {};
    try { const snap = await ref.get(); if (snap.exists) cur = snap.data() || {}; } catch (e) {}
    const r = S.result, at = Date.now();
    const payload = r.kind === "icar" ? { raw: r.raw, iq: r.iq, items: r.items, ids: r.ids, seconds: r.seconds, at, version: 1 }
      : r.kind === "practice" ? { raw: r.raw, total: r.total, items: r.items, seconds: r.seconds, at, version: 1 }
      : { total: r.total, domains: r.domains, items: r.items, seconds: r.seconds, at, version: 1 };
    await ref.set({ ...cur, [r.kind]: payload, ageBand: S.age || null, updatedAt: at });
    S.saveMsg = "Đã gửi kết quả ẩn danh. Cảm ơn bạn đã đóng góp số liệu.";
  } catch (e) {
    S.saveMsg = "Chưa gửi được kết quả (" + (e && e.code ? e.code : "lỗi kết nối") + "). Kết quả vẫn hiển thị bình thường.";
  }
  renderSave();
}

    <div class="field"><label for="age">Nhóm tuổi</label>
      <select id="age">${AGE.map(a => `<option value="${a}"${a === S.age ? " selected" : ""}>${a || "Không cung cấp"}</option>`).join("")}</select></div>
    <label class="check"><input type="checkbox" id="consent"${S.consent ? " checked" : ""}>
      <span>Tôi đồng ý gửi kết quả ẩn danh (điểm, đúng/sai từng câu, thời gian làm bài, nhóm tuổi) để thống kê và hiệu chỉnh thang điểm. Không thu thập họ tên, email.</span></label>
  </section>
  <div class="row"><button class="btn-primary" data-act="start" data-kind="${k}">Bắt đầu làm bài</button></div>
</div>`;
}

// ================= Màn hình: làm bài =================
function questionBody(q, sel) {
  if (S.test === "icar") {
    const content = q.image ? `<div class="stimulus"><img src="${esc(q.image)}" alt="Hình minh họa câu ${esc(q.id)}"></div>` : "";
    const prompt = q.prompt ? `<p class="qtext">${esc(q.prompt)}</p>` : `<div class="placeholder"><strong class="mono">${esc(q.id)}</strong><span>Nội dung câu hỏi sẽ hiện ở đây khi được nạp.</span></div>`;
    const opts = Array.from({ length: q.n }, (_, i) => q.options ? q.options[i] : `Phương án ${i + 1}`);
    return `${prompt}${content}<div class="opts${q.n === 8 ? " eight" : ""}">${opts.map((o, i) => `<button class="opt" data-ans="${i + 1}" aria-pressed="${sel === i + 1}"><span class="k">${LETTERS[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  }
  if (q.type === "likert") {
    return `<p class="qtext">${esc(q.text)}</p>
      <div class="likert" role="group" aria-label="Mức độ đúng với bạn">${LIKERT.map((l, i) => `<button class="opt" data-ans="${i + 1}" aria-pressed="${sel === i + 1}" aria-label="${i + 1} – ${l}"><span class="k">${i + 1}</span><span>${l}</span></button>`).join("")}</div>
      <div class="likert-ends"><span>1 = Hoàn toàn không đúng</span><span>5 = Hoàn toàn đúng</span></div>`;
  }
  if (q.type === "matrix") {
    return `<p class="qtext">${esc(q.text)}</p>
      <div class="stimulus"><div class="matrix">${q.cells.map(c => `<div class="cell">${cellSvg(c)}</div>`).join("")}<div class="cell q">?</div></div></div>
      <div class="opts fig">${q.options.map((o, i) => `<button class="opt fig" data-ans="${i}" aria-pressed="${sel === i}" aria-label="Phương án ${LETTERS[i]}"><span class="k">${LETTERS[i]}</span>${cellSvg(o)}</button>`).join("")}</div>`;
  }
  return `<p class="qtext">${esc(q.text)}</p>${q.series ? `<div class="stimulus"><div class="series">${esc(q.series)}</div></div>` : ""}
    <div class="opts">${q.options.map((o, i) => `<button class="opt" data-ans="${i}" aria-pressed="${sel === i}"><span class="k">${LETTERS[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
}
function testView() {
  const t = TESTS[S.test], items = t.items(), q = items[S.idx], n = items.length;
  const done = S.answers.filter(a => a !== null).length, missing = n - done, last = S.idx === n - 1;
  const label = S.test === "icar" ? ICAR_TYPES[q.type] : S.test === "eq" ? "Mức độ đúng với bạn" : q.section;
  let sheet = "";
  if (S.sheet === "submit") {
    sheet = `<div class="sheet" role="alert"><strong>Còn ${missing} câu chưa trả lời.</strong>
      <span class="small">${S.test === "eq" ? "Bài EQ cần trả lời đủ 30 câu để tính điểm." : "Câu bỏ trống được tính là sai."}</span>
      <div class="row">${S.test !== "eq" ? `<button class="btn-primary" data-act="force">Vẫn nộp bài</button>` : ""}<button data-act="first-missing">Đến câu chưa trả lời</button><button class="btn-ghost" data-act="close-sheet">Đóng</button></div></div>`;
  } else if (S.sheet === "quit") {
    sheet = `<div class="sheet" role="alert"><strong>Thoát bài đang làm?</strong><span class="small">Các câu đã trả lời sẽ không được lưu.</span>
      <div class="row"><button class="btn-primary" data-act="quit">Thoát</button><button data-act="close-sheet">Làm tiếp</button></div></div>`;
  }
  return `<div class="stack ${t.theme}" style="gap:16px">
    <div class="bar">
      <div class="bar-row">
        <button class="btn-ghost" data-act="ask-quit" aria-label="Thoát bài">✕ Thoát</button>
        <span class="bar-title">${t.short}${S.demo ? " · chạy thử" : ""}</span>
        ${t.timed ? `<span class="timer${S.remaining <= 120 ? " low" : ""}" id="timer" aria-label="Thời gian còn lại">${fmt(S.remaining)}</span>` : `<span class="mono small muted">${done}/${n}</span>`}
      </div>
      <div class="segs" style="grid-template-columns:repeat(${n},1fr)" aria-hidden="true">${items.map((_, i) => `<i class="${i === S.idx ? "cur" : S.answers[i] !== null ? "done" : ""}"></i>`).join("")}</div>
    </div>
    ${sheet}
    <section class="qcard" aria-live="polite">
      <div class="qhead"><span class="qnum">Câu ${S.idx + 1} / ${n}</span><span class="qtype">${esc(label)}</span></div>
      ${questionBody(q, S.answers[S.idx])}
    </section>
    <div class="nav">
      <button data-act="prev"${S.idx === 0 ? " disabled" : ""}>← Câu trước</button>
      ${last ? `<button class="btn-primary" data-act="submit">Nộp bài</button>` : `<button class="btn-primary" data-act="next">${S.answers[S.idx] === null ? "Bỏ qua" : "Câu tiếp"} →</button>`}
    </div>
    <p class="kbd"><kbd>1</kbd>–<kbd>${S.test === "icar" ? q.n : S.test === "eq" ? 5 : q.options.length}</kbd> chọn đáp án · <kbd>←</kbd> <kbd>→</kbd> chuyển câu · <kbd>Enter</kbd> câu tiếp</p>
    <details class="panel"><summary>Danh sách câu (${done}/${n} đã trả lời)</summary>
      <div class="grid-nav">${items.map((_, i) => `<button data-go="${i}" class="${S.answers[i] !== null ? "done" : ""}${i === S.idx ? " cur" : ""}" aria-label="Câu ${i + 1}">${i + 1}</button>`).join("")}</div>
      <div class="row"><button class="btn-primary" data-act="submit">Nộp bài</button></div>
    </details>
  </div>`;
}

// ================= Màn hình: kết quả =================
function curveSvg(iq, lo, hi) {
  const W = 640, H = 230, X0 = 24, X1 = 616, base = 180, top = 40, min = 55, max = 145;
  const x = v => X0 + (Math.min(max, Math.max(min, v)) - min) / (max - min) * (X1 - X0);
  const y = v => base - (base - top) * Math.exp(-((v - 100) ** 2) / (2 * 15 * 15));
  let d = `M${x(min)},${base}`;
  for (let v = min; v <= max; v += 1) d += ` L${x(v).toFixed(1)},${y(v).toFixed(1)}`;
  d += ` L${x(max)},${base} Z`;
  let ci = `M${x(lo)},${base}`;
  for (let v = Math.max(min, lo); v <= Math.min(max, hi); v += 1) ci += ` L${x(v).toFixed(1)},${y(v).toFixed(1)}`;
  ci += ` L${x(hi)},${base} Z`;
  const ticks = [70, 85, 100, 115, 130];
  return `<svg class="curve" viewBox="0 0 ${W} ${H}" role="img" aria-label="Vị trí điểm IQ ${iq} trên phân phối chuẩn, khoảng tin cậy ${lo}–${hi}">
    <path d="${d}" fill="var(--sunk)" stroke="var(--line)" stroke-width="1.5"/>
    <path d="${ci}" fill="var(--accent)" fill-opacity="0.22"/>
    <line x1="${x(iq)}" y1="${top - 6}" x2="${x(iq)}" y2="${base}" stroke="var(--accent)" stroke-width="2.5"/>
    <circle cx="${x(iq)}" cy="${y(iq)}" r="5" fill="var(--accent)"/>
    <text class="lbl" x="${x(iq)}" y="${top - 14}" text-anchor="middle">${iq}</text>
    <line x1="${X0}" y1="${base}" x2="${X1}" y2="${base}" stroke="var(--line)"/>
    ${ticks.map(v => `<line x1="${x(v)}" y1="${base}" x2="${x(v)}" y2="${base + 5}" stroke="var(--muted)"/><text x="${x(v)}" y="${base + 30}" text-anchor="middle">${v}</text>`).join("")}
  </svg>`;
}
function saveLine() {
  if (S.result.demo) return `<p class="save">Kết quả chạy thử không được lưu.</p>`;
  return S.consent ? `<p class="save" id="saveMsg">${esc(S.saveMsg)}</p>` : `<p class="save">Bạn chọn không gửi kết quả. Không có dữ liệu nào rời khỏi trình duyệt.</p>`;
}
function resultView() {
  const r = S.result, t = TESTS[r.kind];
  const again = `<div class="row"><button data-act="home">Về danh sách bài</button>${r.kind !== "eq" ? `<button class="btn-primary t-eq" data-act="intro" data-kind="eq">Làm bài EQ</button>` : `<button class="btn-primary t-iq" data-act="intro" data-kind="icar">Làm bài IQ</button>`}</div>`;
  if (r.kind === "icar") {
    const higher = Math.round(r.pct);
    return `<div class="stack ${t.theme}" style="padding-top:24px">
      ${r.demo ? `<div class="notice warn"><strong>Kết quả chạy thử</strong><span>Câu hỏi chưa được nạp nên điểm dưới đây chỉ dùng để kiểm tra giao diện và cách quy đổi.</span></div>` : ""}
      <span class="eyebrow">Kết quả · ${t.name}</span>
      <section class="panel" style="gap:18px">
        <div class="score-hero">
          <div><div class="eyebrow">Điểm IQ quy đổi</div><div class="big">${r.iq}</div></div>
          <div class="stack" style="gap:8px">
            <span class="band">${iqBand(r.iq)}</span>
            <p>Khoảng tin cậy 90%: <strong class="mono">${r.lo}–${r.hi}</strong>. Điểm thực của bạn nhiều khả năng nằm trong khoảng này.</p>
            <p class="muted small">Cao hơn khoảng <strong>${higher}%</strong> số người trong mẫu chuẩn.</p>
          </div>
        </div>
        ${curveSvg(r.iq, r.lo, r.hi)}
        <div class="kpis">
          <div class="kpi"><b>${r.raw}/16</b><span>Câu đúng</span></div>
          <div class="kpi"><b>${r.answered}/16</b><span>Câu đã trả lời</span></div>
          <div class="kpi"><b>${fmt(r.seconds)}</b><span>Thời gian làm bài</span></div>
        </div>
      </section>
      <section class="panel">
        <h3>Theo dạng câu hỏi</h3>
        <div class="tablewrap"><table><thead><tr><th>Dạng</th><th>Đúng</th><th style="width:40%">Tỷ lệ</th></tr></thead>
        <tbody>${Object.entries(r.byType).map(([k, v]) => `<tr><td>${ICAR_TYPES[k]}</td><td class="n">${v.right}/${v.total}</td><td><div class="meter"><i style="width:${v.right / v.total * 100}%"></i></div></td></tr>`).join("")}</tbody></table></div>
      </section>
      <details class="panel"><summary>Bảng quy đổi điểm</summary>
        <div class="tablewrap"><table><thead><tr><th>Câu đúng</th><th>Thứ hạng</th><th>IQ</th><th>Khoảng 90%</th></tr></thead>
        <tbody>${NORM.map(n => `<tr class="${n.raw === r.raw ? "me" : ""}"><td class="n">${n.raw}</td><td class="n">${n.pct.toFixed(1).replace(".", ",")}%</td><td class="n">${n.iq}</td><td class="n">${n.iq - CI90}–${n.iq + CI90}</td></tr>`).join("")}</tbody></table></div>
      </details>
      <details class="panel"><summary>Cách tính và giới hạn</summary>
        <ul class="small">
          <li>Bộ câu hỏi: ICAR Sample Test (ICAR16), Condon & Revelle (2014), <em>Intelligence</em> 43, tr. 52–64. Độ tin cậy α = 0,81; tương quan 0,81–0,82 với bài Shipley-2 sau hiệu chỉnh.</li>
          <li>Mẫu quy đổi: 1.248 người làm đủ 16 câu, dự án SAPA (08–31/8/2012), bộ dữ liệu <span class="mono">ability</span> trong gói psychTools 2.6.4. Điểm trung bình 8,37/16, độ lệch chuẩn 3,93.</li>
          <li>Quy đổi theo thứ hạng phần trăm trong mẫu sang thang IQ trung bình 100, độ lệch chuẩn 15. Khoảng tin cậy 90% = ±10 điểm (sai số chuẩn 6,2).</li>
          <li>Mẫu gồm người tình nguyện làm bài trực tuyến, phần lớn ở Mỹ, chưa đại diện cho dân số Việt Nam. Chưa có thang riêng theo nhóm tuổi.</li>
          <li>Nhãn mô tả theo thang phân loại của Wechsler. Bài không dùng để chẩn đoán.</li>
        </ul>
      </details>
      ${saveLine()}${again}</div>`;
  }
  if (r.kind === "practice") {
    return `<div class="stack ${t.theme}" style="padding-top:24px">
      <span class="eyebrow">Kết quả · ${t.name}</span>
      <section class="panel" style="gap:18px">
        <div class="score-hero">
          <div><div class="eyebrow">Câu đúng</div><div class="big">${r.raw}<span class="muted" style="font-size:.4em">/${r.total}</span></div></div>
          <div class="stack" style="gap:8px"><p>Tỷ lệ đúng <strong class="mono">${Math.round(r.raw / r.total * 100)}%</strong> · thời gian <strong class="mono">${fmt(r.seconds)}</strong></p>
          <p class="small"><span class="muted">Điểm IQ quy đổi:</span> <span class="missing">Chưa có số liệu chuẩn hóa</span>. Muốn có điểm IQ, hãy làm bài ICAR16.</p></div>
        </div>
        <div class="tablewrap"><table><thead><tr><th>Phần</th><th>Đúng</th><th style="width:40%">Tỷ lệ</th></tr></thead>
        <tbody>${Object.entries(r.sections).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n">${v.right}/${v.total}</td><td><div class="meter"><i style="width:${v.right / v.total * 100}%"></i></div></td></tr>`).join("")}</tbody></table></div>
      </section>
      <section class="panel"><h3>Từng câu</h3><div class="dots">${r.items.map((ok, i) => `<span class="dot ${ok ? "ok" : "no"}" title="Câu ${i + 1}: ${ok ? "đúng" : "sai"}">${i + 1}</span>`).join("")}</div>
        <p class="small muted">Xanh: đúng · Đỏ: sai hoặc bỏ trống.</p></section>
      ${saveLine()}${again}</div>`;
  }
  const pct = Math.round((r.total - 30) / 120 * 100);
  const ranked = r.domains.map((d, i) => ({ i, d })).sort((a, b) => b.d - a.d);
  return `<div class="stack ${t.theme}" style="padding-top:24px">
    <span class="eyebrow">Kết quả · ${t.name}</span>
    <section class="panel" style="gap:18px">
      <div class="score-hero">
        <div><div class="eyebrow">Tổng điểm</div><div class="big">${r.total}<span class="muted" style="font-size:.4em">/150</span></div></div>
        <div class="stack" style="gap:8px"><span class="band">${eqLevel(pct)}</span>
          <p>Thành phần nổi bật: <strong>${EQ_DOMAINS[ranked[0].i]}</strong>. Thành phần nên chú ý: <strong>${EQ_DOMAINS[ranked[4].i]}</strong>.</p></div>
      </div>
      <div class="tablewrap"><table><thead><tr><th>Thành phần</th><th>Điểm</th><th style="width:38%">Mức</th></tr></thead>
      <tbody>${r.domains.map((d, i) => { const p = Math.round((d - 6) / 24 * 100); return `<tr><td>${EQ_DOMAINS[i]}</td><td class="n">${d}/30</td><td><div class="meter"><i style="width:${Math.max(p, 2)}%"></i></div><span class="small muted">${eqLevel(p)}</span></td></tr>`; }).join("")}</tbody></table></div>
      <p class="small muted">Mức xác định theo vị trí điểm trên thang của bài: dưới 40% Cần cải thiện, 40–59% Trung bình, 60–79% Khá, từ 80% Cao. Đây không phải so sánh với điểm của người khác.</p>
    </section>
    ${saveLine()}${again}</div>`;
}

// ================= Điều phối =================
function render(scrollTop) {
  const app = $("#app");
  app.innerHTML = S.view === "home" ? home() : S.view === "intro" ? intro() : S.view === "test" ? testView() : resultView();
  if (scrollTop) window.scrollTo(0, 0);
}
function answerValueCount() { const items = TESTS[S.test].items(), q = items[S.idx]; return S.test === "icar" ? q.n : S.test === "eq" ? 5 : q.options.length; }
function choose(v) {
  const items = TESTS[S.test].items();
  S.answers[S.idx] = v; S.sheet = null;
  if (S.test === "eq" && S.idx < items.length - 1) { render(); setTimeout(() => { S.idx++; render(); }, 160); return; }
  render();
}
function go(delta) {
  const n = TESTS[S.test].items().length;
  const next = S.idx + delta;
  if (next >= 0 && next < n) { S.idx = next; S.sheet = null; render(); }
}
function submit() { if (S.answers.some(a => a === null)) { S.sheet = "submit"; render(true); } else finish(); }

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  if (b.dataset.ans !== undefined) { choose(Number(b.dataset.ans)); return; }
  if (b.dataset.go !== undefined) { S.idx = Number(b.dataset.go); S.sheet = null; render(true); return; }
  switch (b.dataset.act) {
    case "intro": S.view = "intro"; S.test = b.dataset.kind; render(true); break;
    case "start": startTest(b.dataset.kind); break;
    case "prev": go(-1); break;
    case "next": go(1); break;
    case "submit": submit(); break;
    case "force": finish(); break;
    case "first-missing": S.idx = S.answers.findIndex(a => a === null); S.sheet = null; render(true); break;
    case "ask-quit": S.sheet = "quit"; render(true); break;
    case "close-sheet": S.sheet = null; render(); break;
    case "quit": clearInterval(timerId); S.view = "home"; S.sheet = null; render(true); break;
    case "home": clearInterval(timerId); S.view = "home"; render(true); break;
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "age") S.age = e.target.value;
  if (e.target.id === "consent") S.consent = e.target.checked;
});
document.addEventListener("keydown", e => {
  if (S.view !== "test" || S.sheet || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[1-8]$/.test(e.key)) {
    const k = Number(e.key);
    if (k > answerValueCount()) return;
    choose(S.test === "icar" || S.test === "eq" ? k : k - 1);
  } else if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "Enter" && !(e.target instanceof HTMLButtonElement)) {
    const n = TESTS[S.test].items().length;
    S.idx === n - 1 ? submit() : go(1);
  }
});

// Nhận biết chủ sở hữu trang để cho phép chạy thử khung ICAR16 khi chưa nạp câu hỏi.
(async () => {
  try { const user = await window.claude?.use?.("user"); IS_OWNER = !!(user && await user.isOwner()); } catch (e) {}
  if (S.view === "home" || S.view === "intro") render();
})();

// Giữ trạng thái bài đang làm khi trang được cập nhật phiên bản mới.
window.claude?.hot?.snapshot?.(() => ({ ...S }));
function boot(data) {
  if (data && data.view) { S = { ...S, ...data }; if (S.view === "test" && TESTS[S.test]?.timed) runTimer(); }
  render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
